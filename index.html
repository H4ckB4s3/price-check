
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>HNS Historical Price Calculator</title>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/warning.js" defer></script>
</head>

<body>
  <header>
    <h1>HNS Historical Price Calculator</h1>
    <p class="description">Calculate the historical USD/BTC value</p>

    <div class="current-price">
      <i class="fas fa-coins"></i>
      Current Price:
      <span id="current-price-value">Loading...</span>
    </div>
  </header>

  <main class="container">
    <div class="input-group">
      <label for="date-display">Date</label>

      <div class="date-selector">
        <button type="button" class="date-display" id="date-display">
          <span id="selected-date">Select a date</span>
          <i class="fas fa-calendar-alt"></i>
        </button>

        <div class="calendar-popup" id="calendar-popup" style="display:none;">
          <div class="calendar-header">
            <button type="button" id="prev-month" aria-label="Previous month">
              <i class="fas fa-chevron-left"></i>
            </button>

            <div>
              <span id="calendar-month"></span>
              <select id="calendar-year" aria-label="Calendar year"></select>
            </div>

            <button type="button" id="next-month" aria-label="Next month">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>

          <div class="weekday-grid">
            <div class="weekday-header">Sun</div>
            <div class="weekday-header">Mon</div>
            <div class="weekday-header">Tue</div>
            <div class="weekday-header">Wed</div>
            <div class="weekday-header">Thu</div>
            <div class="weekday-header">Fri</div>
            <div class="weekday-header">Sat</div>
          </div>

          <div class="days-grid" id="calendar-days"></div>
        </div>
      </div>
    </div>

    <div class="input-group">
      <label for="amount">HNS amount</label>

      <div class="hns-input">
        <span class="hns-prefix">HNS</span>
        <input
          type="number"
          id="amount"
          placeholder="Enter amount"
          min="0"
          max="888000000"
          step="any"
          inputmode="decimal"
        >
      </div>
    </div>

    <button type="button" id="calculate-btn">
      <i class="fas fa-calculator"></i>
      Check Historical Price
    </button>

    <div class="loading" id="loading" style="display:none;">
      <i class="fas fa-spinner fa-spin"></i>
      Fetching data...
    </div>

    <div class="error" id="error" role="alert" style="display:none;"></div>

    <section class="result" id="result" style="display:none;">
      <h3>Historical Value</h3>
      <div class="price" id="price">$0.00</div>
      <div class="price" id="price-btc">0.000000000000 BTC</div>
      <div class="date-info" id="date-info"></div>
    </section>
  </main>

  <footer>
    &copy; <span id="current-year"></span> -
    <a href="https://github.com/Falci/price.hns.dev"
       target="_blank" rel="noopener noreferrer">API Source</a> |
    <a href="https://price.hns.dev/documentation.html"
       target="_blank" rel="noopener noreferrer">Price API</a> |
    <a href="https://shakeshift.com"
       target="_blank" rel="noopener noreferrer">Explorer</a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      'use strict';

      const API = '/api';
      const MIN_DATE = new Date(Date.UTC(2020, 1, 13));

      let currentDate = new Date();
      let selectedDate = null;
      let requestInProgress = false;

      const $ = id => document.getElementById(id);

      const yearSelect = $('calendar-year');
      const monthLabel = $('calendar-month');
      const calendarDays = $('calendar-days');
      const calendarPopup = $('calendar-popup');
      const dateDisplay = $('date-display');
      const selectedDateLabel = $('selected-date');
      const amountInput = $('amount');
      const calculateBtn = $('calculate-btn');
      const loading = $('loading');
      const errorBox = $('error');
      const result = $('result');

      $('current-year').textContent = new Date().getFullYear();

      function todayUTC() {
        const now = new Date();
        return new Date(Date.UTC(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        ));
      }

      function formatDate(date) {
        return [
          date.getUTCFullYear(),
          String(date.getUTCMonth() + 1).padStart(2, '0'),
          String(date.getUTCDate()).padStart(2, '0')
        ].join('-');
      }

      // Fill the calendar year dropdown.
      for (
        let year = MIN_DATE.getUTCFullYear();
        year <= todayUTC().getUTCFullYear();
        year++
      ) {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearSelect.appendChild(option);
      }

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      function updateCalendar() {
        const today = todayUTC();

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        monthLabel.textContent = new Date(year, month, 1)
          .toLocaleString('en-US', { month: 'long' });

        yearSelect.value = year;
        calendarDays.innerHTML = '';

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement('div');
          empty.className = 'calendar-cell empty';
          calendarDays.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const cellDate = new Date(Date.UTC(year, month, day));
          const cell = document.createElement('button');

          cell.type = 'button';
          cell.className = 'calendar-cell';
          cell.textContent = day;

          const disabled =
            cellDate < MIN_DATE || cellDate > today;

          if (disabled) {
            cell.classList.add('disabled');
            cell.disabled = true;
          }

          if (
            selectedDate &&
            formatDate(selectedDate) === formatDate(cellDate)
          ) {
            cell.classList.add('selected');
          }

          if (!disabled) {
            cell.addEventListener('click', () => {
              selectedDate = cellDate;
              selectedDateLabel.textContent = formatDate(cellDate);
              calendarPopup.style.display = 'none';
              updateCalendar();
              clearError();
            });
          }

          calendarDays.appendChild(cell);
        }

        $('prev-month').disabled =
          year === MIN_DATE.getUTCFullYear() && month === 1;

        $('next-month').disabled =
          year === today.getUTCFullYear() &&
          month === today.getUTCMonth();
      }

      dateDisplay.addEventListener('click', () => {
        const open = calendarPopup.style.display === 'block';
        calendarPopup.style.display = open ? 'none' : 'block';
      });

      $('prev-month').addEventListener('click', () => {
        currentDate = new Date(
          currentDate.getFullYear(),
          currentDate.getMonth() - 1,
          1
        );
        updateCalendar();
      });

      $('next-month').addEventListener('click', () => {
        currentDate = new Date(
          currentDate.getFullYear(),
          currentDate.getMonth() + 1,
          1
        );
        updateCalendar();
      });

      yearSelect.addEventListener('change', () => {
        currentDate = new Date(
          Number(yearSelect.value),
          currentDate.getMonth(),
          1
        );
        updateCalendar();
      });

      document.addEventListener('click', event => {
        if (
          !calendarPopup.contains(event.target) &&
          !dateDisplay.contains(event.target)
        ) {
          calendarPopup.style.display = 'none';
        }
      });

      // All requests go to the local Python server.
      // server.py must implement these /api routes.
      async function apiRequest(path) {
        const response = await fetch(API + path, {
          method: 'GET',
          cache: 'no-store',
          headers: { 'Accept': 'application/json, text/plain' }
        });

        if (!response.ok) {
          let detail = '';

          try {
            detail = await response.text();
          } catch (_) {}

          throw new Error(
            `Local API returned HTTP ${response.status}` +
            (detail ? `: ${detail.slice(0, 180)}` : '')
          );
        }

        return response;
      }

      async function fetchCurrentPrice() {
        try {
          const response = await apiRequest('/latest?currency=usd');
          const raw = await response.text();

          let price;

          try {
            const parsed = JSON.parse(raw);
            price = typeof parsed === 'number'
              ? parsed
              : Number(parsed.price ?? parsed.value);
          } catch (_) {
            price = Number(raw.trim());
          }

          if (!Number.isFinite(price) || price < 0) {
            throw new Error('Invalid current price returned by the API');
          }

          $('current-price-value').textContent =
            `$${price.toFixed(6)}`;

        } catch (err) {
          console.error('Current price request failed:', err);
          $('current-price-value').textContent = 'Unavailable';
        }
      }

      function calculatePreciseAverage(data) {
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error('No historical price data available for this date.');
        }

        const prices = data.map(item => Number(item.price));

        if (prices.some(price => !Number.isFinite(price) || price < 0)) {
          throw new Error(
            'The historical API returned an invalid price format.'
          );
        }

        const multiplier = 1e12;
        let sum = 0;

        for (const price of prices) {
          sum += Math.round(price * multiplier);
        }

        return sum / prices.length / multiplier;
      }

      function formatSmallNumber(num, precision = 12) {
        if (!Number.isFinite(num)) return 'Unavailable';
        return num.toFixed(precision);
      }

      async function fetchHistoricalPrices(date, currency) {
        const query =
          `?from=${encodeURIComponent(date)}` +
          `&currency=${encodeURIComponent(currency)}`;

        const response = await apiRequest('/historical' + query);
        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          console.error('Unexpected historical response:', data);
          throw new Error(
            `No ${currency.toUpperCase()} historical data was returned for ${date}.`
          );
        }

        const validData = data.filter(item =>
          item &&
          item.price !== null &&
          item.price !== '' &&
          Number.isFinite(Number(item.price)) &&
          Number(item.price) >= 0
        );

        if (!validData.length) {
          throw new Error(
            `The ${currency.toUpperCase()} response contains no valid price records.`
          );
        }

        return validData;
      }

      async function fetchHistoricalData(date, amount) {
        loading.style.display = 'block';
        result.style.display = 'none';
        clearError();

        try {
          const [usdData, btcData] = await Promise.all([
            fetchHistoricalPrices(date, 'usd'),
            fetchHistoricalPrices(date, 'btc')
          ]);

          const avgUsd = calculatePreciseAverage(usdData);
          const avgBtc = calculatePreciseAverage(btcData);

          const valueUsd = avgUsd * amount;
          const valueBtc = avgBtc * amount;

          if (
            !Number.isFinite(valueUsd) ||
            !Number.isFinite(valueBtc)
          ) {
            throw new Error('The calculated value is outside the supported range.');
          }

          $('price').textContent =
            `$${valueUsd.toLocaleString('en-US', {
              minimumFractionDigits: 2,
              maximumFractionDigits: 6
            })}`;

          $('price-btc').textContent =
            `${formatSmallNumber(valueBtc, 12)} BTC`;

          $('date-info').textContent =
            `Based on ${usdData.length} USD and ${btcData.length} BTC records. ` +
            `Average per HNS on ${date}: ` +
            `$${avgUsd.toFixed(6)} / ` +
            `${formatSmallNumber(avgBtc, 12)} BTC.`;

          result.style.display = 'block';

          console.log('Historical calculation:', {
            date,
            usdRecords: usdData.length,
            btcRecords: btcData.length,
            avgUsd,
            avgBtc,
            valueUsd,
            valueBtc
          });

        } catch (err) {
          console.error('Historical price lookup failed:', err);

          showError(
            `Price lookup failed: ${err.message || 'Unknown error'}. ` +
            'Make sure server.py is running and its API routes are available.'
          );

        } finally {
          loading.style.display = 'none';
        }
      }

      calculateBtn.addEventListener('click', async () => {
        if (requestInProgress) return;

        clearError();

        if (!selectedDate) {
          showError('Please select a date.');
          return;
        }

        const amountText = amountInput.value.trim();
        const amount = Number(amountText);

        if (
          amountText === '' ||
          !Number.isFinite(amount) ||
          amount <= 0
        ) {
          showError('Please enter a valid HNS amount.');
          return;
        }

        if (amount > 888000000) {
          showError('Maximum HNS amount is 888,000,000.');
          return;
        }

        if (
          selectedDate < MIN_DATE ||
          selectedDate > todayUTC()
        ) {
          showError('Please select a valid date.');
          return;
        }

        requestInProgress = true;
        calculateBtn.disabled = true;

        try {
          await fetchHistoricalData(formatDate(selectedDate), amount);
        } finally {
          requestInProgress = false;
          calculateBtn.disabled = false;
        }
      });

      amountInput.addEventListener('input', clearError);

      updateCalendar();
      fetchCurrentPrice();
    });
  </script>
</body>
</html>
