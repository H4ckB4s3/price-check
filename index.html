
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HNS Historical Price Calculator</title>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="css/style.css">
  <script src="js/warning.js" defer></script>
</head>

<body>
  <header>
    <h1>HNS Historical Price Calculator</h1>
    <p class="description">Calculate the USD/BTC value</p>

    <div class="current-price">
      <i class="fas fa-coins"></i>
      Current Price:
      <span id="current-price-value">Loading...</span>
    </div>
  </header>

  <div class="container">

    <!-- Date selector -->
    <div class="input-group">
      <label for="date-display">Date</label>

      <div class="date-selector">
        <div class="date-display" id="date-display">
          <span id="selected-date">Select a date</span>
          <i class="fas fa-calendar-alt"></i>
        </div>

        <div class="calendar-popup" id="calendar-popup">
          <div class="calendar-header">
            <button type="button" id="prev-month" aria-label="Previous month">
              <i class="fas fa-chevron-left"></i>
            </button>

            <div>
              <span id="calendar-month"></span>
              <select id="calendar-year" aria-label="Select year"></select>
            </div>

            <button type="button" id="next-month" aria-label="Next month">
              <i class="fas fa-chevron-right"></i>
            </button>
          </div>

          <div class="weekday-grid">
            <div class="weekday-header">Sun</div>
            <div class="weekday-header">Mon</div>
            <div class="weekday-header">Tue</div>
            <div class="weekday-header">Wed</div>
            <div class="weekday-header">Thu</div>
            <div class="weekday-header">Fri</div>
            <div class="weekday-header">Sat</div>
          </div>

          <div class="days-grid" id="calendar-days"></div>
        </div>
      </div>
    </div>

    <!-- HNS amount -->
    <div class="input-group">
      <div class="hns-input">
        <span class="hns-prefix">HNS</span>
        <input
          type="number"
          id="amount"
          placeholder="Enter amount"
          min="0"
          max="888000000"
          step="any"
          inputmode="decimal"
        >
      </div>
    </div>

    <button type="button" id="calculate-btn">
      <i class="fas fa-calculator"></i>
      Check Historical Price
    </button>

    <div class="loading" id="loading" style="display:none;">
      <i class="fas fa-spinner fa-spin"></i>
      Fetching data...
    </div>

    <div class="error" id="error" role="alert" style="display:none;"></div>

    <!-- Results -->
    <div class="result" id="result" style="display:none;">
      <h3>Historical Value</h3>
      <div class="price" id="price">$0.00</div>
      <div class="price" id="price-btc">0.00000000 BTC</div>
      <div class="date-info" id="date-info"></div>
    </div>
  </div>

  <footer>
    &copy; <span id="current-year"></span> -
    <a href="https://github.com/H4ckB4s3/price-check"
       target="_blank" rel="noopener noreferrer">Github</a> |
    <a href="https://price.hns.dev/"
       target="_blank" rel="noopener noreferrer">Price API</a> |
    <a href="https://shakeshift.com"
       target="_blank" rel="noopener noreferrer">Explorer</a>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('current-year').textContent =
        new Date().getFullYear();

      let currentDate = new Date();
      let selectedDate = null;
      let requestInProgress = false;

      // Use UTC dates consistently for date comparisons.
      const minDate = new Date(Date.UTC(2020, 1, 13));

      function getTodayUTC() {
        const now = new Date();
        return new Date(Date.UTC(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        ));
      }

      const yearSelect = document.getElementById('calendar-year');
      const monthLabel = document.getElementById('calendar-month');
      const calendarDays = document.getElementById('calendar-days');
      const calendarPopup = document.getElementById('calendar-popup');
      const dateDisplay = document.getElementById('date-display');
      const selectedDateLabel = document.getElementById('selected-date');
      const amountInput = document.getElementById('amount');
      const calculateBtn = document.getElementById('calculate-btn');
      const loading = document.getElementById('loading');
      const errorBox = document.getElementById('error');
      const result = document.getElementById('result');

      // Populate the year dropdown.
      const firstYear = minDate.getUTCFullYear();
      const lastYear = new Date().getFullYear();

      for (let y = firstYear; y <= lastYear; y++) {
        const option = document.createElement('option');
        option.value = y;
        option.textContent = y;
        yearSelect.appendChild(option);
      }

      // Format a date as YYYY-MM-DD.
      function formatDate(date) {
        const year = date.getUTCFullYear();
        const month = String(date.getUTCMonth() + 1).padStart(2, '0');
        const day = String(date.getUTCDate()).padStart(2, '0');

        return `${year}-${month}-${day}`;
      }

      function updateCalendar() {
        const today = getTodayUTC();

        if (currentDate < minDate) {
          currentDate = new Date(minDate);
        }

        if (
          currentDate.getFullYear() > today.getUTCFullYear() ||
          (
            currentDate.getFullYear() === today.getUTCFullYear() &&
            currentDate.getMonth() > today.getUTCMonth()
          )
        ) {
          currentDate = new Date(
            today.getUTCFullYear(),
            today.getUTCMonth(),
            1
          );
        }

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        monthLabel.textContent = currentDate.toLocaleString('en-US', {
          month: 'long'
        });

        yearSelect.value = year;
        calendarDays.innerHTML = '';

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = 'calendar-cell empty';
          calendarDays.appendChild(emptyCell);
        }

        for (let d = 1; d <= daysInMonth; d++) {
          const cellDate = new Date(Date.UTC(year, month, d));
          const cell = document.createElement('div');

          cell.className = 'calendar-cell';
          cell.textContent = d;

          const dateString = formatDate(cellDate);
          const isDisabled =
            cellDate < minDate || cellDate > today;

          if (isDisabled) {
            cell.classList.add('disabled');
            cell.setAttribute('aria-disabled', 'true');
          } else {
            cell.setAttribute('role', 'button');
            cell.setAttribute('tabindex', '0');
            cell.setAttribute('aria-label', dateString);

            if (
              selectedDate &&
              dateString === formatDate(selectedDate)
            ) {
              cell.classList.add('selected');
            }

            const chooseDate = () => {
              selectedDate = cellDate;
              selectedDateLabel.textContent = dateString;
              calendarPopup.style.display = 'none';
              updateCalendar();
              hideError();
            };

            cell.addEventListener('click', chooseDate);

            cell.addEventListener('keydown', event => {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                chooseDate();
              }
            });
          }

          calendarDays.appendChild(cell);
        }

        document.getElementById('prev-month').disabled =
          year === firstYear && month === 1;

        document.getElementById('next-month').disabled =
          year === today.getUTCFullYear() &&
          month === today.getUTCMonth();
      }

      updateCalendar();

      dateDisplay.addEventListener('click', () => {
        const isOpen = calendarPopup.style.display === 'block';
        calendarPopup.style.display = isOpen ? 'none' : 'block';
      });

      document.getElementById('prev-month').addEventListener('click', () => {
        currentDate = new Date(
          currentDate.getFullYear(),
          currentDate.getMonth() - 1,
          1
        );

        updateCalendar();
      });

      document.getElementById('next-month').addEventListener('click', () => {
        currentDate = new Date(
          currentDate.getFullYear(),
          currentDate.getMonth() + 1,
          1
        );

        updateCalendar();
      });

      yearSelect.addEventListener('change', () => {
        currentDate = new Date(
          Number(yearSelect.value),
          currentDate.getMonth(),
          1
        );

        updateCalendar();
      });

      document.addEventListener('click', event => {
        if (
          !calendarPopup.contains(event.target) &&
          !dateDisplay.contains(event.target)
        ) {
          calendarPopup.style.display = 'none';
        }
      });

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function hideError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      // Current price. Uses the API directly, without a CORS proxy.
      async function fetchCurrentPrice() {
        const priceElement =
          document.getElementById('current-price-value');

        try {
          const response = await fetch(
            'https://price.hns.dev/latest',
            { cache: 'no-store' }
          );

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const text = await response.text();
          const price = Number(text.trim());

          if (!Number.isFinite(price) || price < 0) {
            throw new Error('Invalid current price response');
          }

          priceElement.textContent = `$${price.toFixed(6)}`;
        } catch (err) {
          console.error('Current price request failed:', err);
          priceElement.textContent = 'Unavailable';
        }
      }

      fetchCurrentPrice();

      // Convert very small numbers to decimal notation.
      function formatSmallNumber(num, precision = 12) {
        if (!Number.isFinite(num)) {
          return 'Unavailable';
        }

        // Avoid negative zero in displayed results.
        if (Object.is(num, -0)) {
          num = 0;
        }

        return num.toFixed(precision);
      }

      // Average only valid numeric prices.
      function calculatePreciseAverage(data) {
        if (!Array.isArray(data) || data.length === 0) {
          throw new Error('No historical price data available');
        }

        const prices = data.map(item => Number(item.price));

        if (
          prices.some(price =>
            !Number.isFinite(price) || price < 0
          )
        ) {
          throw new Error('The API returned invalid price values');
        }

        // Scale prices to retain additional decimal precision.
        const multiplier = 1e12;

        const sum = prices.reduce((total, price) => {
          return total + Math.round(price * multiplier);
        }, 0);

        return sum / prices.length / multiplier;
      }

      // Request historical prices directly from the API.
      async function fetchHistoricalPrices(date, currency) {
        const url =
          `https://price.hns.dev/historical?from=${encodeURIComponent(date)}` +
          `&currency=${encodeURIComponent(currency)}`;

        const response = await fetch(url, {
          cache: 'no-store'
        });

        if (!response.ok) {
          throw new Error(
            `${currency.toUpperCase()} API returned HTTP ${response.status}`
          );
        }

        const data = await response.json();

        if (!Array.isArray(data) || data.length === 0) {
          console.error(
            `${currency.toUpperCase()} API returned unexpected data:`,
            data
          );

          throw new Error(
            `No ${currency.toUpperCase()} historical prices were returned`
          );
        }

        const validData = data.filter(item =>
          item &&
          item.price !== null &&
          item.price !== '' &&
          Number.isFinite(Number(item.price)) &&
          Number(item.price) >= 0
        );

        if (validData.length === 0) {
          console.error(
            `${currency.toUpperCase()} data contains no valid prices:`,
            data
          );

          throw new Error(
            `The ${currency.toUpperCase()} API response contains no valid prices`
          );
        }

        return validData;
      }

      // Calculate and display the historical value.
      async function fetchHistoricalData(date, amount) {
        loading.style.display = 'block';
        result.style.display = 'none';
        hideError();

        try {
          // Fetch USD and BTC data concurrently.
          const [usdData, btcData] = await Promise.all([
            fetchHistoricalPrices(date, 'usd'),
            fetchHistoricalPrices(date, 'btc')
          ]);

          const avgUsd = calculatePreciseAverage(usdData);
          const avgBtc = calculatePreciseAverage(btcData);

          const valUsd = Math.round(avgUsd * amount * 1e6) / 1e6;
          const valBtc = avgBtc * amount;

          if (
            !Number.isFinite(valUsd) ||
            !Number.isFinite(valBtc)
          ) {
            throw new Error('Calculated value is outside the supported range');
          }

          document.getElementById('price').textContent =
            `$${valUsd.toLocaleString('en-US', {
              minimumFractionDigits: 2,
              maximumFractionDigits: 6
            })}`;

          document.getElementById('price-btc').textContent =
            `${formatSmallNumber(valBtc, 12)} BTC`;

          document.getElementById('date-info').textContent =
            `Based on avg price $${avgUsd.toFixed(6)} / ` +
            `${formatSmallNumber(avgBtc, 12)} BTC per HNS on ${date}`;

          result.style.display = 'block';

          console.log('Historical price calculation:', {
            date,
            usdDataPoints: usdData.length,
            btcDataPoints: btcData.length,
            avgUsd,
            avgBtc,
            calculatedValueUSD: valUsd,
            calculatedValueBTC: valBtc
          });

        } catch (err) {
          console.error('Historical price lookup failed:', err);

          let message = err.message || 'Unknown error';

          if (err instanceof TypeError) {
            message =
              'Network request failed. This may be a CORS, connectivity, ' +
              'or API availability problem. Check the browser console.';
          }

          showError(`Price lookup failed: ${message}`);

        } finally {
          loading.style.display = 'none';
        }
      }

      // Validate input and start the calculation.
      calculateBtn.addEventListener('click', async () => {
        if (requestInProgress) {
          return;
        }

        if (!selectedDate) {
          showError('Please select a date.');
          return;
        }

        const amountText = amountInput.value.trim();
        const amount = Number(amountText);

        if (
          amountText === '' ||
          !Number.isFinite(amount) ||
          amount <= 0
        ) {
          showError('Please enter a valid HNS amount.');
          return;
        }

        if (amount > 888000000) {
          showError('Maximum HNS amount is 888,000,000.');
          return;
        }

        if (
          selectedDate < minDate ||
          selectedDate > getTodayUTC()
        ) {
          showError('Please select a date between 2020-02-13 and today.');
          return;
        }

        requestInProgress = true;
        calculateBtn.disabled = true;

        try {
          await fetchHistoricalData(formatDate(selectedDate), amount);
        } finally {
          requestInProgress = false;
          calculateBtn.disabled = false;
        }
      });

      amountInput.addEventListener('input', hideError);
    });
  </script>
</body>
</html>
